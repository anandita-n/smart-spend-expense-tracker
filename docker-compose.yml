version: '3.9'

services:

  frontend:
    build: ./frontend
    ports:
      - "3001:8080"
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "5001:5000"
    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: smartspend
      JWT_SECRET: mysecretkey
    depends_on:
      - mysql

  mysql:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: smartspend
    ports:
      - "3308:3306"